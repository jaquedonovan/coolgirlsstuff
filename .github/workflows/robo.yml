name: Robô de ofertas

# O robô fica "acordado": roda uma rodada a cada 20 minutos por cerca de 5h20
# e, no fim, chama a si mesmo pra começar o próximo turno. O agendamento abaixo
# é só um reserva, caso a corrente pare por algum motivo.
on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: robo
  cancel-in-progress: false

jobs:
  rodar:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rodar a cada 20 minutos
        env:
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_SECRET: ${{ secrets.SHOPEE_SECRET }}
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          ML_REFRESH_TOKEN: ${{ secrets.ML_REFRESH_TOKEN }}
          ML_MATT_WORD: ${{ secrets.ML_MATT_WORD }}
          ML_MATT_TOOL: ${{ secrets.ML_MATT_TOOL }}
          AMAZON_CREDENTIAL_ID: ${{ secrets.AMAZON_CREDENTIAL_ID }}
          AMAZON_CREDENTIAL_SECRET: ${{ secrets.AMAZON_CREDENTIAL_SECRET }}
          AMAZON_VERSION: ${{ secrets.AMAZON_VERSION }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GH_TOKEN: ${{ github.token }}
          RODADAS: "16"           # 16 rodadas x 20 min ≈ 5h20 por turno
          INTERVALO: "1200"       # segundos entre o início de uma rodada e a próxima
        run: |
          git config user.name "robo-coolgirls"
          git config user.email "robo-coolgirls@users.noreply.github.com"
          for i in $(seq 1 "$RODADAS"); do
            inicio=$(date +%s)
            echo "::group::Rodada $i de $RODADAS ($(TZ=America/Sao_Paulo date '+%d/%m %H:%M'))"
            git pull -q --rebase || true            # pega mudanças no config.toml e cupons.toml
            python robo/robo.py || echo "Rodada $i teve erro; tento de novo na próxima."
            if [ -f .ml_refresh_token_novo ]; then
              if [ -n "$GH_PAT" ]; then GH_TOKEN="$GH_PAT" gh secret set ML_REFRESH_TOKEN < .ml_refresh_token_novo; fi
              rm -f .ml_refresh_token_novo
            fi
            git add docs/ofertas.json
            if ! git diff --cached --quiet; then
              git commit -q -m "ofertas atualizadas"
              git pull -q --rebase && git push -q && \
                gh workflow run publicar-site.yml --ref main || echo "Não consegui publicar nesta rodada."
            fi
            echo "::endgroup::"
            [ "$i" -lt "$RODADAS" ] || break
            espera=$(( INTERVALO - ( $(date +%s) - inicio ) ))
            if [ "$espera" -gt 0 ]; then sleep "$espera"; fi
          done

      - name: Começar o próximo turno
        if: success() || failure()   # se você cancelar a rodada na mão, a corrente para
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run robo.yml --ref main
