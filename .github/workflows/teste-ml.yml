name: Teste leitura Mercado Livre
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import re, urllib.request, html
          UA={"User-Agent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130 Safari/537.36","Accept-Language":"pt-BR"}
          def get(u):
              r=urllib.request.urlopen(urllib.request.Request(u,headers=UA),timeout=20); return r.status, r.geturl(), r.read().decode("utf-8","replace")
          try:
              s,u,h=get("https://lista.mercadolivre.com.br/principia-serum-vitamina-c-10")
              print("LISTA",s,len(h))
              links=re.findall(r'https://(?:www|produto)\.mercadolivre\.com\.br/[^"\s#?]*(?:MLB-?\d+|/p/MLB\d+)[^"\s#?]*',h)
              print("links",len(links)); print(links[:2])
              s,u,h=get(links[0])
              print("PRODUTO",s,u[:90],len(h))
              for k in ["og:title","og:image","og:description"]:
                  m=re.search(r'<meta[^>]+property="%s"[^>]+content="([^"]+)"'%k,h); print(k,"=>",html.unescape(m.group(1))[:120] if m else None)
              for pat in [r'itemprop="price"\s+content="([\d.]+)"', r'"price":\s*([\d.]+)', r'"original_price":\s*([\d.]+)']:
                  m=re.search(pat,h); print(pat,"=>",m.group(1) if m else None)
          except Exception as e:
              print("ERRO",e)
          PY
