name: Conectar Mercado Livre

# Só precisa rodar se o robô avisar que o Mercado Livre pediu autorização.
on:
  workflow_dispatch:
    inputs:
      codigo:
        description: "Código TG-... que apareceu no site (deixe vazio na primeira vez)"
        required: false
        default: ""

jobs:
  conectar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Conectar
        env:
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          ML_REDIRECT_URI: ${{ vars.SITE_URL }}
          CODIGO: ${{ inputs.codigo }}
        run: python robo/ml_conectar.py
      - name: Guardar token
        if: hashFiles('.ml_refresh_token_novo') != ''
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: gh secret set ML_REFRESH_TOKEN < .ml_refresh_token_novo
