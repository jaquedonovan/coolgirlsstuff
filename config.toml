# ─────────────────────────────────────────────────────────────
#  COOL GIRLS STUFF · configurações do robô
#  Pode editar este arquivo direto no GitHub (ícone de lápis).
#  Senhas e chaves NÃO ficam aqui: elas vão em Settings > Secrets.
# ─────────────────────────────────────────────────────────────

[geral]
nome_do_grupo = "COOL GIRLS STUFF"
link_do_grupo = ""                 # ex: "https://chat.whatsapp.com/xxxx" (vai no fim das mensagens)
instagram = "https://www.instagram.com/jacque.dnvn/"  # ex: "https://instagram.com/coolgirlsstuff" (ícone no topo do site)
tiktok = "https://www.tiktok.com/@jacque.dnvn"  # ex: "https://tiktok.com/@coolgirlsstuff"
desconto_minimo = 20               # só entra oferta com pelo menos X% de desconto
desconto_minimo_favoritas = 10     # para as suas lojas favoritas o corte é mais baixo
preco_minimo = 15                  # em reais
preco_maximo = 800
nota_minima = 4.5                  # avaliação mínima do produto (quando a loja informa)
horas_ate_sair = 24                # oferta que o robô não encontrar mais por X horas sai do catálogo
maximo_de_ofertas = 300
aviso_afiliada = "#publi"
frase_urgencia = "Essa promoção pode acabar a qualquer momento!"

# Palavras que o robô usa pra procurar. Pode tirar e colocar à vontade.
buscas = [
  "sérum facial", "protetor solar facial", "skincare coreano", "hidratante facial",
  "perfume feminino", "body splash", "máscara de cílios", "base maquiagem",
  "batom", "paleta de sombras", "shampoo", "máscara capilar", "óleo capilar",
  "creme corporal", "esmalte", "kit presente beleza",
]

# Produtos com estas palavras no nome nunca entram.
palavras_proibidas = ["réplica", "replica", "inspirado", "contratipo", "usado", "amostra grátis"]

# ─────────────────────────────────────────────
[shopee]
ligado = true
so_lojas_oficiais = true           # true = só lojas oficiais (Shopee Mall, shopee.com.br/oficial). As favoritas sempre entram.

# Suas lojas favoritas: o robô olha TODAS as ofertas delas, mesmo sem palavra-chave,
# e elas ganham o destaque "K-beauty" no catálogo.
# usuario = o final do link da loja (shopee.com.br/USUARIO). O robô descobre o número (shop_id) sozinho.
[[shopee.lojas_favoritas]]
nome = "Koksara"
usuario = "koksara.br"
busca = "koksara"
shop_id = 0

[[shopee.lojas_favoritas]]
nome = "Glory of Seoul"
usuario = "gloryofseoul.br"
busca = "glory of seoul"
shop_id = 0

# ─────────────────────────────────────────────
[mercado_livre]
ligado = true
categoria = "MLB1246"              # Beleza e Cuidado Pessoal
so_lojas_oficiais = false
so_full = false                    # true = só produtos com entrega Full

# ─────────────────────────────────────────────
[amazon]
ligado = true
tag = ""                           # seu ID de associada (termina em -20), ex: "coolgirls-20"
indice = ""                        # opcional: categoria da Amazon pra buscar (vazio = todas)
